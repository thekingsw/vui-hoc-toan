name: toan_lop_5
description: "Hành trình khám phá — app học Toán lớp 5 offline (SGK Kết nối tri thức)."
publish_to: "none"
version: 1.3.0+4

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3+1
  path: ^1.9.0
  audioplayers: ^6.1.0
  http: ^1.2.2
  package_info_plus: ^8.0.0
  path_provider: ^2.1.4
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/sounds/
    - assets/config/
    - assets/config/island_scenes/
    - assets/images/mascot/
    - assets/images/islands/
    - assets/images/items/
    - assets/images/nodes/
    - assets/images/scenes/
    - assets/images/map/
    - assets/images/ui/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
          weight: 400
        - asset: assets/fonts/Nunito.ttf
          weight: 700
        - asset: assets/fonts/Nunito.ttf
          weight: 800
    # Baloo 2 cho tiêu đề và số (SPEC mục 1); CI tải file font này.
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2.ttf
          weight: 400
        - asset: assets/fonts/Baloo2.ttf
          weight: 700
        - asset: assets/fonts/Baloo2.ttf
          weight: 800
