name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Gradle 8.3 + AGP 8.1 need JDK 17; runner default is newer)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore binary assets (font, sounds, icons, gradle wrapper)
        run: |
          mkdir -p assets/fonts assets/sounds android/gradle/wrapper
          curl -fsSL -o assets/fonts/Nunito.ttf "https://github.com/google/fonts/raw/main/ofl/nunito/Nunito%5Bwght%5D.ttf"
          curl -fsSL -o assets/fonts/Baloo2.ttf "https://github.com/google/fonts/raw/main/ofl/baloo2/Baloo2%5Bwght%5D.ttf"
          curl -fsSL -o android/gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradle/wrapper/gradle-wrapper.jar"
          # Ảnh game đợt 3 lưu dạng base64 (text) trong repo, giải mã thành .webp
          find assets/images -name '*.webp.b64' | while read f; do base64 -d "$f" > "${f%.b64}"; done
          # Âm thanh ogg thật lưu dạng base64 (text) trong repo, giải mã thành .ogg rồi xóa .b64
          find assets/sounds -name '*.ogg.b64' | while read f; do base64 -d "$f" > "${f%.b64}"; rm "$f"; done
          # Icon app lưu dạng base64 trong repo, giải mã thành .png rồi xóa
          # file .b64 (AAPT không chấp nhận file lạ trong thư mục res)
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            base64 -d "android/app/src/main/res/mipmap-$d/ic_launcher.png.b64" > "android/app/src/main/res/mipmap-$d/ic_launcher.png"
            rm "android/app/src/main/res/mipmap-$d/ic_launcher.png.b64"
          done

      - name: Restore signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/release-key.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$GITHUB_WORKSPACE/android/release-key.jks"
          } > android/key.properties

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/*.apk

      - name: Read app version from pubspec
        id: ver
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # Tự đăng Release mỗi lần build main thành công, tag lấy từ
      # version trong pubspec (vd 1.5.1+9 -> v1.5.1) — không cần tạo
      # tag tay. Nếu Release đã có (đẩy lại cùng version), asset được
      # ghi đè bằng bản mới nhất.
      - name: Publish GitHub Release (auto tag from pubspec version)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          files: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          generate_release_notes: true
